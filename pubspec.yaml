name: cuisine_mada
description: Application de suggestions de recettes malgaches
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  dio: ^5.3.3
  go_router: ^12.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.18.1
  image_picker: ^1.0.4
  connectivity_plus: ^5.0.2
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/